[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "devoniq-aris-core"
version = "0.2.0"
description = "Open-source mission-intelligence and simulation core for autonomous drone research."
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = {text = "Apache-2.0"}
authors = [{name = "Devoniq"}]
dependencies = [
  "fastapi==0.116.1",
  "uvicorn==0.35.0",
  "pydantic==2.11.7",
  "httpx==0.28.1",
  "Pillow==11.3.0",
  "numpy==2.2.6",
  "opencv-python-headless==4.11.0.86",
  "shapely==2.1.1",
]

[project.optional-dependencies]
sim = ["pybullet==3.2.7"]
px4 = ["mavsdk-grpc==3.17.4"]
dev = ["pytest==8.4.1"]

[tool.setuptools.packages.find]
include = ["app*", "simulation*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
