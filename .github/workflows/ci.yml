name: CI

on:
  push:
  pull_request:

jobs:
  core:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m tools.community_self_test
      - run: python -m pytest

  simulation-import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements-sim.txt
      - run: python -c "import pybullet; import simulation.world; import simulation.server; print('simulation imports: PASS')"

  px4-mavsdk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements-dev.txt -r requirements-px4.txt
      - run: python -c "from mavsdk_grpc import System; print('mavsdk-grpc import: PASS')"
      - run: python -m pytest tests/test_px4_mavsdk_adapter.py tests/test_adapter_factory.py
